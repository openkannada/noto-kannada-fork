[project]
name = "noto-kannada-fork-tests"
version = "0"
description = "Shaping tests for the Kannada fixes in this fork"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fonttools==4.68.0", "uharfbuzz==0.57.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]
build = ["fontmake==3.12.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
