name: Fork CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group build --group release
      - name: Build the variable fonts
        run: |
          uv run fontmake -g sources/NotoSansKannada.glyphs -o variable --output-dir build/sans --no-production-names
          uv run fontmake -g sources/NotoSerifKannada.glyphs -o variable --output-dir build/serif --no-production-names
      - name: Rename the built fonts
        run: |
          uv run python tools/rename.py sans build/sans/NotoSansKannada-VF.ttf dist/
          uv run python tools/rename.py serif build/serif/NotoSerifKannada-VF.ttf dist/
      - name: Kannada font health
        uses: openkannada/font-health-action@v1
        with:
          fonts: dist/*.ttf
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: font-health
          path: font-health/report.json
      - run: uv run ruff check tests tools
      - run: uv run ruff format --check tests tools
      - run: uv run pytest -q
